{% extends "base.html" %}

{% block title %}Log In | UniPro Marketplace{% endblock %}

{% block content %}
<div class="container form-page">
    <div class="form-card narrow">
        <h2>Welcome back</h2>
        <p class="subtitle">Log in with your email address.</p>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-grid" style="grid-template-columns: 1fr;">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <label class="form-check">
                    <input type="checkbox" name="remember" value="1"> Keep me logged in
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Log in</button>
            </div>
            <p class="form-footer">New to UniPro? <a href="{{ url_for('register') }}">Create an account</a></p>
        </form>
    </div>
</div>
{% endblock %}
