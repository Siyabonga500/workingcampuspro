<div class="table-wrap">
    <table class="admin-table">
        <thead>
            <tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th></tr>
        </thead>
        <tbody>
            {% for item in order.items %}
            <tr>
                <td>
                    <div class="item-cell">
                        {% if item.product and item.product.images %}
                        <img class="table-thumb" src="{{ url_for('static', filename='uploads/' ~ item.product.images[0].filename) }}" alt="">
                        {% endif %}
                        <span>{{ item.product_name }}</span>
                    </div>
                </td>
                <td>R {{ '%.2f'|format(item.unit_price) }}</td>
                <td>{{ item.quantity }}</td>
                <td>R {{ '%.2f'|format(item.line_total) }}</td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr><th colspan="3" style="text-align:right;">Order total</th><th>R {{ '%.2f'|format(order.total) }}</th></tr>
        </tfoot>
    </table>
</div>
